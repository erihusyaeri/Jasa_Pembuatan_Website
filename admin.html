<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Eri Web Kilat Studio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- jQuery & Summernote Lite (Text Editor) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f3f4f6; }
        /* Perbaikan tampilan Summernote agar tidak tertimpa Tailwind */
        .note-editor.note-frame.fullscreen { z-index: 1050; background: white; }
    </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen p-4">

    <!-- Container Utama -->
    <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl overflow-hidden border border-gray-200">
        
        <!-- Header Panel Admin -->
        <div class="bg-blue-700 p-4 text-white flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-lock text-xl"></i>
                <h1 class="font-bold text-lg">Eri Web Kilat - Dashboard Admin</h1>
            </div>
            <a href="index.html" class="text-sm text-blue-200 hover:text-white underline transition">
                <i class="fa-solid fa-arrow-left"></i> Ke Web Utama
            </a>
        </div>

        <div class="p-6 md:p-8">
            
            <!-- VIEW 1: FORM LOGIN -->
            <div id="login-view" class="max-w-md mx-auto space-y-6">
                <div class="text-center">
                    <h2 class="text-2xl font-bold text-gray-800">Login Admin</h2>
                    <p class="text-sm text-gray-500 mt-1">Gunakan <strong>admin@webkilat.com</strong> & pass: <strong>12345678</strong> untuk akses cepat.</p>
                </div>
                
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Email</label>
                        <input type="email" id="login-email" required class="w-full border border-gray-300 rounded p-3 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" placeholder="admin@webkilat.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Password</label>
                        <input type="password" id="login-password" required class="w-full border border-gray-300 rounded p-3 text-sm focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600" placeholder="••••••••">
                    </div>
                    <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow transition">Masuk Panel</button>
                </form>
            </div>

            <!-- VIEW 2: DASHBOARD UTAMA (Muncul setelah login) -->
            <div id="dashboard-view" class="hidden space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b border-gray-200 pb-4 gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">Tulis / Input Layanan Baru</h2>
                        <p id="status-koneksi" class="text-xs text-yellow-600 font-semibold mt-1">
                            <i class="fa-solid fa-triangle-exclamation"></i> Mode Offline Aktif
                        </p>
                    </div>
                    <button id="logout-btn" class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-500 hover:text-white px-4 py-2 rounded text-sm font-semibold transition">
                        Logout
                    </button>
                </div>

                <!-- Form Input Artikel -->
                <form id="blog-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">Kategori</label>
                            <select id="blog-category" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-600 outline-none">
                                <option value="Paket Basic">Paket Basic (Landing Page)</option>
                                <option value="Paket UMKM">Paket UMKM (Company Profile)</option>
                                <option value="E-Commerce">E-Commerce (Toko Online)</option>
                                <option value="Artikel & Berita">Artikel & Berita (Blog)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1">Harga (Opsional)</label>
                            <input type="text" id="blog-price" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-600 outline-none" placeholder="Contoh: Rp 500.000 / Gratis">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Judul Layanan / Artikel</label>
                        <input type="text" id="blog-title" required class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-600 outline-none" placeholder="Masukkan judul menarik">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">URL Gambar Thumbnail</label>
                        <input type="url" id="blog-image" class="w-full border border-gray-300 rounded p-3 text-sm focus:border-blue-600 outline-none" placeholder="https://contohgambar.com/gambar.jpg" value="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
                    </div>

                    <!-- Editor Teks Summernote -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Isi Lengkap (Desain Suka-suka)</label>
                        <textarea id="blog-description" name="editordata"></textarea>
                    </div>

                    <div class="pt-4 border-t border-gray-100">
                        <button type="submit" id="btn-publish" class="w-full md:w-auto bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded shadow-md transition flex justify-center items-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i> <span>Terbitkan ke Website</span>
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & DATABASE -->
    <script>
        $(document).ready(function() {
            // 1. INISIALISASI TEXT EDITOR
            $('#blog-description').summernote({
                placeholder: 'Tuliskan deskripsi lengkap, keuntungan, gambar, atau isi artikel di sini...',
                tabsize: 2,
                height: 300,
                toolbar: [
                  ['style', ['style']],
                  ['font', ['bold', 'underline', 'clear', 'italic']],
                  ['color', ['color']],
                  ['para', ['ul', 'ol', 'paragraph']],
                  ['table', ['table']],
                  ['insert', ['link', 'picture', 'video']],
                  ['view', ['fullscreen', 'codeview', 'help']]
                ]
            });

            // 2. KONFIGURASI DATABASE SUPABASE
            const SUPABASE_URL = "https://koderahasianya.supabase.co"; 
            const SUPABASE_ANON_KEY = "sb_publishable_tCwTxG62nKMkL38d5NtBIg_icxsH1oQ";
            
            let supabase = null;
            try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');
            const statusKoneksi = document.getElementById('status-koneksi');

            // 3. FUNGSI CEK LOGIN
            async function checkAuth() {
                // Cek apakah pakai Bypass Mode (Offline)
                const isBypass = localStorage.getItem('admin_bypass_login') === 'true';
                
                // Cek Supabase
                let hasSupabaseSession = false;
                if (supabase) {
                    try {
                        const { data } = await supabase.auth.getSession();
                        if(data && data.session) hasSupabaseSession = true;
                    } catch(e) {}
                }

                if (hasSupabaseSession || isBypass) {
                    loginView.classList.add('hidden');
                    dashboardView.classList.remove('hidden');

                    if (hasSupabaseSession) {
                        statusKoneksi.innerHTML = '<i class="fa-solid fa-circle-check"></i> Terkoneksi Supabase Online';
                        statusKoneksi.className = "text-xs text-green-600 font-semibold mt-1";
                    } else {
                        statusKoneksi.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Mode Local Offline Aktif';
                        statusKoneksi.className = "text-xs text-yellow-600 font-semibold mt-1";
                    }
                } else {
                    loginView.classList.remove('hidden');
                    dashboardView.classList.add('hidden');
                }
            }

            checkAuth(); // Panggil saat web dimuat

            // 4. LOGIKA TOMBOL LOGIN (DENGAN BYPASS)
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-login');
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memeriksa...'; 
                btn.disabled = true;

                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    // Coba login online
                    if (!supabase) throw new Error("Client Supabase tidak valid");
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    
                    localStorage.setItem('admin_bypass_login', 'false');
                    checkAuth();
                } catch (err) {
                    // JIKA GAGAL ONLINE, CEK APAKAH PAKAI AKUN OFFLINE
                    if (email === 'admin@webkilat.com' && password === '12345678') {
                        alert("Berhasil masuk menggunakan Mode Offline (Local Storage).");
                        localStorage.setItem('admin_bypass_login', 'true');
                        checkAuth();
                    } else {
                        alert("Login Gagal! Jika Anda belum mensetting database, gunakan email: admin@webkilat.com dan pass: 12345678");
                    }
                }
                
                btn.innerHTML = 'Masuk Panel'; 
                btn.disabled = false;
            });

            // 5. LOGIKA LOGOUT
            document.getElementById('logout-btn').addEventListener('click', async () => {
                if (supabase) {
                    try { await supabase.auth.signOut(); } catch(e) {}
                }
                localStorage.removeItem('admin_bypass_login');
                checkAuth(); 
            });

            // 6. LOGIKA PUBLISH ARTIKEL (ONLINE / OFFLINE)
            document.getElementById('blog-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('btn-publish');
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...';
                btn.disabled = true;

                // Ambil format HTML dari editor
                const htmlContent = $('#blog-description').summernote('code');

                const newBlog = {
                    id: Date.now(), // Digunakan untuk ID unik saat offline
                    category: document.getElementById('blog-category').value,
                    price: document.getElementById('blog-price').value || "Gratis",
                    title: document.getElementById('blog-title').value,
                    image: document.getElementById('blog-image').value,
                    description: htmlContent
                };

                const isBypass = localStorage.getItem('admin_bypass_login') === 'true';

                if (!isBypass && supabase) {
                    // SIMPAN KE SUPABASE ONLINE
                    try {
                        const { error } = await supabase.from('blogs').insert([{
                            category: newBlog.category,
                            price: newBlog.price,
                            title: newBlog.title,
                            image: newBlog.image,
                            description: newBlog.description
                        }]);
                        if (error) throw error;
                        alert("Berhasil! Konten Anda telah diterbitkan ke Database Online.");
                        resetForm();
                    } catch (err) {
                        simpanOffline(newBlog, "Gagal simpan online, dialihkan ke penyimpanan Offline.");
                    }
                } else {
                    // SIMPAN KE LOCAL STORAGE (OFFLINE)
                    simpanOffline(newBlog, "Berhasil diterbitkan! (Disimpan di memori browser Offline)");
                }

                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Terbitkan ke Website</span>';
                btn.disabled = false;
            });

            // Fungsi Bantuan Simpan Offline
            function simpanOffline(dataBlog, pesan) {
                // Ambil data lama
                let dataLama = JSON.parse(localStorage.getItem('eri_web_blogs') || '[]');
                // Masukkan data baru di posisi paling atas
                dataLama.unshift(dataBlog);
                // Simpan kembali
                localStorage.setItem('eri_web_blogs', JSON.stringify(dataLama));
                alert(pesan);
                resetForm();
            }

            // Fungsi Reset Tampilan
            function resetForm() {
                document.getElementById('blog-form').reset();
                $('#blog-description').summernote('reset');
            }
        });
    </script>
</body>
</html>
